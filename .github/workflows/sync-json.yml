name: sync-json

on:
  push:
    branches:
      - main
    paths:
      - "default.json5"
      - ".github/workflows/sync-json.yml"

permissions:
  contents: write

jobs:
  convert-json5-to-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout and authenticate as GitHub App
        id: auth
        uses: nsheaps/github-actions/.github/actions/checkout-as-app@73744811f700bbd90b482b17d133e20a8ecdbfdb # checkout-as-app@main
        with:
          app-id: ${{ secrets.AUTOMATION_GITHUB_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_GITHUB_APP_PRIVATE_KEY }}

      - uses: ./.github/actions/setup-node

      - name: Convert default.json5 to default.json
        run: |
          npx json5 default.json5 | jq '.' > default.json
          # Format with biome to match project style (compact single-element arrays)
          yarn biome format --write --vcs-enabled=false default.json

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet default.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7
        with:
          commit_message: "chore: sync default.json from default.json5 [skip ci]"
          file_pattern: default.json
          commit_user_name: ${{ steps.auth.outputs.user-name }}
          commit_user_email: ${{ steps.auth.outputs.user-email }}
