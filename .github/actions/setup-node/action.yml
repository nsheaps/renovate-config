name: "Setup Node.js"
description: "Setup Node.js with mise, corepack, and install dependencies"

runs:
  using: "composite"
  steps:
    - name: Setup mise
      uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5
      with:
        install: true
        cache: true

    - name: Enable Corepack
      shell: bash
      run: |
        corepack enable
        corepack install
        # Regenerate shims so mise picks up the corepack-managed yarn
        mise reshim

    - name: Install dependencies
      shell: bash
      run: yarn install --frozen-lockfile
